<div class="auth-shell d-flex align-items-center justify-content-center p-3">
  <div class="card auth-card">
    <div class="card-body p-4 p-md-5">
      <div class="hero-icon mb-3">🚌</div>
      <h2 class="fw-bold mb-1">Welcome to BusGo</h2>
      <p class="text-muted mb-4">Login to book your next bus journey.</p>

      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="you@example.com">
          <div class="text-danger small mt-1" *ngIf="form.controls.email.touched && form.controls.email.invalid">
            Enter a valid email.
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" formControlName="password" placeholder="Minimum 6 characters">
          <div class="text-danger small mt-1" *ngIf="form.controls.password.touched && form.controls.password.invalid">
            Password must contain at least 6 characters.
          </div>
        </div>

        <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">
          Login
        </button>
      </form>

      <p class="text-center text-muted mt-4 mb-0">
        New user?
        <a routerLink="/register" class="fw-semibold">Create an account</a>
      </p>
    </div>
  </div>
</div>
