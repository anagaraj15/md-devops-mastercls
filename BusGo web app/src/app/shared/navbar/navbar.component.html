<nav class="navbar navbar-expand-lg app-navbar">
  <div class="container py-2">
    <a class="navbar-brand brand fs-4" routerLink="/search">🚌 BusGo</a>

    <div class="ms-auto d-flex align-items-center gap-2">
      <ng-container *ngIf="auth.isLoggedIn(); else guest">
        <span class="d-none d-sm-inline text-muted small">
          Hi, {{ auth.getCurrentUser()?.name }}
        </span>
        <button class="btn btn-outline-danger btn-sm" (click)="logout()">Logout</button>
      </ng-container>

      <ng-template #guest>
        <a routerLink="/login" class="btn btn-outline-primary btn-sm">Login</a>
        <a routerLink="/register" class="btn btn-primary btn-sm">Register</a>
      </ng-template>
    </div>
  </div>
</nav>
